[package]
name = "photoreal"
version = "0.1.0"
edition = "2024"
description = "Photoreal people stills (two-pass face fix) and Wan 2.2 image-to-video clips from a TOML shot list, rendered on any ComfyUI server"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
